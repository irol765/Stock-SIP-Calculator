<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>US Stock SIP Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
              }
            }
          },
        },
      }
    </script>
    <style>
      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        
        body {
          background-color: white !important;
          color: #111 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          font-family: 'Inter', sans-serif;
        }
        
        /* Universal Hide */
        .no-print, 
        .no-print-section,
        header,
        button,
        input,
        select,
        .text-xs.underline {
          display: none !important;
        }

        /* Layout overrides */
        #root { width: 100%; }
        .lg\:col-span-8 { width: 100% !important; grid-column: span 12 !important; }
        .max-w-7xl { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }

        /* Page 1: Cover */
        .print-cover-page {
          display: flex !important;
          flex-direction: column;
          justify-content: center;
          /* Use strict height to ensure single page */
          height: 297mm; /* A4 height */
          width: 100%;
          padding: 60px;
          background: white;
          position: relative;
          break-after: page; /* Force break after cover */
          box-sizing: border-box;
        }
        
        /* Cover Decorative Element */
        .print-cover-page::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 12px;
            background-color: #0284c7; /* Primary 600 */
        }

        /* Page 2: Charts/Stats */
        .print-page-2 {
            padding: 40px;
            break-after: page; /* Force break after charts */
            min-height: 90vh; /* Ensure it takes up space */
            box-sizing: border-box;
        }

        /* Page 3: AI Report */
        .print-page-3 {
            padding: 40px;
            break-before: page;
            min-height: 50vh;
            box-sizing: border-box;
        }

        /* Styling enhancements for print */
        .bg-white, .dark\:bg-gray-800 {
          background-color: white !important;
          border: none !important; /* Remove card borders for cleaner print */
          box-shadow: none !important;
          color: black !important;
        }

        /* Typography */
        h1 { font-size: 3rem !important; line-height: 1.1 !important; }
        h2 { font-size: 2rem !important; margin-bottom: 1.5rem !important; border-bottom: 2px solid #eee; padding-bottom: 0.5rem; }
        p { font-size: 14px !important; }

        /* Recharts Fixes */
        .recharts-text { fill: #000 !important; font-size: 10px !important; }
        .recharts-cartesian-grid line { stroke: #ccc !important; opacity: 0.5 !important; }
        .recharts-curve { stroke-width: 2px !important; }
        
        /* Text Color Fixes */
        .text-gray-900, .dark\:text-white { color: #000 !important; }
        .text-gray-500, .dark\:text-gray-400 { color: #555 !important; }
        .text-primary-600, .dark\:text-primary-400 { color: #0284c7 !important; }
        .prose, .dark\:prose-invert { color: #000 !important; }
        
        .print-break-inside { break-inside: avoid; margin-bottom: 2rem; }
      }
      
      /* Hide print-specific sections on screen */
      .print-cover-page { display: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
