<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>US Stock SIP Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
              }
            }
          },
        },
      }
    </script>
    <style>
      @media print {
        @page {
          size: A4;
          margin: 15mm 15mm;
        }
        
        body {
          background-color: white !important;
          color: #111 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        /* Hide UI elements */
        .no-print, 
        .no-print-section,
        header,
        button,
        input,
        select,
        .text-xs.underline {
          display: none !important;
        }

        /* Layout overrides */
        .lg\:col-span-8 {
          width: 100% !important;
          grid-column: span 12 !important;
        }
        
        .max-w-7xl {
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        /* Card Styling for Print */
        .bg-white, .dark\:bg-gray-800 {
          background-color: white !important;
          border: 1px solid #ddd !important;
          box-shadow: none !important;
          border-radius: 8px !important;
          margin-bottom: 20px;
        }

        /* Typography overrides */
        .text-gray-900, .dark\:text-white {
          color: #000 !important;
        }
        .text-gray-500, .dark\:text-gray-400 {
          color: #444 !important;
        }
        .text-primary-600, .dark\:text-primary-400 {
          color: #0284c7 !important; /* Force a readable blue */
        }
        .prose, .dark\:prose-invert {
          color: #000 !important;
        }

        /* Recharts / SVG Fixes for Print */
        /* Force axis text to be black regardless of theme */
        .recharts-text {
          fill: #000 !important; 
        }
        /* Force grid lines to be visible but subtle */
        .recharts-cartesian-grid line {
          stroke: #ccc !important;
          opacity: 0.5 !important;
        }
        /* Ensure lines are visible */
        .recharts-curve {
          stroke-width: 2px !important;
        }
        /* Fix background areas */
        .recharts-surface {
          overflow: visible;
        }

        /* Print Header/Footer visibility */
        .print-header-container {
          display: block !important;
          margin-bottom: 24px;
          border-bottom: 2px solid #0284c7;
          padding-bottom: 12px;
        }
        
        .print-footer-container {
          display: block !important;
          position: fixed;
          bottom: 0;
          left: 0;
          width: 100%;
          text-align: center;
          font-size: 10px;
          color: #666;
          border-top: 1px solid #eee;
          padding-top: 8px;
          background: white;
        }

        .print-break-inside {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
      
      .print-header-container, .print-footer-container {
        display: none;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
