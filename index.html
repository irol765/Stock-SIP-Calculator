<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>US Stock SIP Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
              }
            }
          },
        },
      }
    </script>
    <style>
      @media print {
        @page {
          size: A4;
          margin: 0; /* Control margin manually per section */
        }
        
        body {
          background-color: white !important;
          color: #111 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        /* Universal Hide */
        .no-print, 
        .no-print-section,
        header,
        button,
        input,
        select,
        .text-xs.underline {
          display: none !important;
        }

        /* Layout overrides */
        #root {
            width: 100%;
        }
        .lg\:col-span-8 {
          width: 100% !important;
          grid-column: span 12 !important;
        }
        .max-w-7xl {
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        /* Page 1: Cover */
        .print-cover-page {
          display: flex !important;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100%;
          page-break-after: always;
          padding: 40px;
          background: white;
          position: relative;
        }

        /* Page 2: Charts/Stats */
        .print-page-2 {
            padding: 40px;
            page-break-after: always;
            min-height: 100vh;
        }

        /* Page 3: AI Report */
        .print-page-3 {
            padding: 40px;
            page-break-before: always;
            min-height: 100vh;
        }

        /* Styling enhancements for print */
        .bg-white, .dark\:bg-gray-800 {
          background-color: white !important;
          border: 1px solid #ddd !important;
          box-shadow: none !important;
          color: black !important;
        }

        /* Recharts Fixes */
        .recharts-text { fill: #000 !important; }
        .recharts-cartesian-grid line { stroke: #ccc !important; opacity: 0.5 !important; }
        .recharts-curve { stroke-width: 2px !important; }
        
        /* Text Color Fixes */
        .text-gray-900, .dark\:text-white { color: #000 !important; }
        .text-gray-500, .dark\:text-gray-400 { color: #444 !important; }
        .text-primary-600, .dark\:text-primary-400 { color: #0284c7 !important; }
        .prose, .dark\:prose-invert { color: #000 !important; }
        
        /* Ensure elements inside cards break nicely if needed */
        .print-break-inside {
          break-inside: avoid;
        }
      }
      
      /* Hide print-specific sections on screen */
      .print-cover-page {
        display: none;
      }
      .print-footer-container {
        display: none; /* Only show on print pages if needed, but handled by page structure */
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
